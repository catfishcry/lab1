name: Lab1 CI Security Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  security-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      # SAST Bandit 静态源代码扫描
      - name: SAST Bandit scan
        run: bandit -r . -f json -o bandit-report.json --exit-zero

      # SCA Safety依赖扫描
      - name: SCA safety dependency scan
        run: safety check > safety-report.txt || true

      # 上传两份报告
      - name: Upload Bandit report
        uses: actions/upload-artifact@v6
        with:
          name: bandit-sast-report
          path: bandit-report.json

      - name: Upload Safety report
        uses: actions/upload-artifact@v6
        with:
          name: safety-sca-report
          path: safety-report.txt
