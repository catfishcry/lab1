name: Lab1 CI Security Scan
on:
  push:
    branches: [ main ]
  
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit snyk
      
      # SAST Bandit 静态扫描
      - name: SAST Bandit scan
        env:
          SECRET_KEY: "lab1_secret_key_123456"
        run: bandit -r . || true
      
      # SCA Snyk
      - name: SCA Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --org=catfishcry --json > snyk-report.json || true
          snyk test --file=requirements.txt --org=catfishcry || true
      
      # 上传SCA报告
      - name: Upload Snyk SCA report
        uses: actions/upload-artifact@v6
        with:
          name: snyk-sca-report
          path: snyk-report.json
