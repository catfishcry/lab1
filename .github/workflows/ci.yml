name: Lab1 CI Security Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      # SAST Bandit 静态扫描，注入SECRET_KEY环境变量
      - name: SAST Bandit scan
        env:
          SECRET_KEY: "lab1_secret_key_123456"
        run: bandit -r . || true

      # SCA Safety依赖扫描，屏蔽警告
      - name: SCA safety dependency scan
        run: |
          python -W ignore::DeprecationWarning -m safety scan || true
