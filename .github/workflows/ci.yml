name: Lab1 CI Security Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup JDK 17 for OWASP Dependency-Check
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      # SAST Bandit 静态扫描
      - name: SAST Bandit scan
        env:
          SECRET_KEY: "lab1_secret_key_123456"
        run: bandit -r . || true

      # SCA OWASP Dependency-Check，生成HTML报告
      - name: SCA OWASP Dependency-Check scan
        run: |
          wget https://github.com/dependency-check/DependencyCheck/releases/download/v10.0.0/dependency-check-10.0.0-release.zip
          unzip dependency-check-10.0.0-release.zip
          ./dependency-check/bin/dependency-check.sh \
            --project Lab1-Python-Flask \
            --scan . \
            --out ./dc-report \
            --format HTML \
            --failOnCVSS 10
            --noupdate
          || true

      # 上传SCA HTML报告工件
      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v6
        with:
          name: owasp-dependency-check-report
          path: dc-report/
